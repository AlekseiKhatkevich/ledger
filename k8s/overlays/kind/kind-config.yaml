# kind cluster configuration for Ledger project
# 1 control-plane + 1 worker node
# Port mapping for HAProxy LoadBalancer access
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 8000
        protocol: TCP
      - containerPort: 30001
        hostPort: 8080
        protocol: TCP
      - containerPort: 30002
        hostPort: 5432
        protocol: TCP
  - role: worker