[project]
name = "ledger"
version = "0.22.8"
description = "Keeos track on you crypto assets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "asyncstdlib>=3.13.1",
    "granian[reload,uvloop]>=2.7.1",
    "litestar[opentelemetry,standard]>=2.20.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "pydantic-settings>=2.13.1",
    "python-keycloak>=7.1.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "pydevd-pycharm~=253.30387.173",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-randomly>=4.0.1",
    "remote-pdb>=2.1.0",
    "web-pdb>=1.6.3",
]

[tool.pytest.ini_options]
console_output_style = "count"
filterwarnings = [
    "ignore::UserWarning",
    "ignore:Core Pydantic V1 functionality",
]
asyncio_mode = "auto"
