x-environment: &common_env
  KEYCLOAK_DOMAIN: keycloak
  KEYCLOAK_PORT: 8080
  KEYCLOAK_SCHEME: https
  KEYCLOACK_LEDGER_REALM: test

x-extra: &temporal_env
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_CLI_ADDRESS: temporal:7233


services:
  backend-api:
    build: .
    expose:
      - '8000'
    environment:
      <<:
        -  *common_env
        -  *temporal_env
      GRANIAN_RELOAD: 1
      GRANIAN_WORKERS_LIFETIME: 60
      GRANIAN_METRICS_ENABLED: 1
      GRANIAN_RESPAWN_FAILED_WORKERS: 1
      GRANIAN_PROCESS_NAME: "granian"
#      GRANIAN_WORKERS: 1
      GRANIAN_LOOP: "asyncio"  #  "auto" in prod. "asyncio" suitable for debugging with @Evaluate Async Code@
      UV_NO_DEV: 0
      ALEMBIC_CONFIG: alembic/alembic.ini
      PGHOSTADDR: haproxy
      DEBUG: ${DEBUG:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"  # send all spas there
      OTEL_SERVICE_NAME: "ledger-backend"
    networks: [ ledger-network ]
    profiles: [main, temporal]
    healthcheck:
      test: ["CMD-SHELL", "./aux/docker/healthcheck/backend_healthcheck.sh"]
      interval: 10s
      timeout: 2s
      retries: 2
      start_period: 1s
      start_interval: 1s
    restart: unless-stopped
    volumes:
      - ./alembic:/app/alembic:z
      - .:/app:Z
    depends_on:
      keycloak:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./docker-compose.yaml
          target: ./app/docker-compose.yaml
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile

#  ---

  postgres:
    build: aux/docker/postgres_custom
    shm_size: 1g
    container_name: postgres
    restart: unless-stopped
    profiles: [main, temporal]
    command: [
      "postgres",
      "-c", "shared_buffers=8GB",
      "-c", "effective_cache_size=24GB",
      "-c", "work_mem=64MB",
      "-c", "maintenance_work_mem=2GB",
      "-c", "wal_buffers=64MB",
      "-c", "huge_pages=try",
      "-c", "max_connections=200",
      "-c", "superuser_reserved_connections=3",
      "-c", "wal_level=logical",
      "-c", "max_replication_slots=10",
      "-c", "max_wal_senders=10",
      "-c", "max_slot_wal_keep_size=1GB",
      "-c", "max_wal_size=4GB",
      "-c", "min_wal_size=1GB",
      "-c", "wal_compression=on",
      "-c", "synchronous_commit=on",
      "-c", "checkpoint_timeout=15min",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "bgwriter_delay=200ms",
      "-c", "bgwriter_lru_maxpages=100",
      "-c", "bgwriter_lru_multiplier=2.0",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
      "-c", "default_statistics_target=100",
      "-c", "max_parallel_workers_per_gather=2",
      "-c", "max_parallel_workers=8",
      "-c", "max_parallel_maintenance_workers=2",
      "-c", "autovacuum=on",
      "-c", "autovacuum_max_workers=3",
      "-c", "autovacuum_vacuum_scale_factor=0.1",
      "-c", "autovacuum_analyze_scale_factor=0.05",
      "-c", "autovacuum_vacuum_cost_delay=2ms",
      "-c", "autovacuum_vacuum_cost_limit=1000",
      "-c", "log_filename='postgresql-%Y-%m-%d.log'",
      "-c", "log_min_duration_statement=1000",
      "-c", "log_checkpoints=on",
      "-c", "log_lock_waits=on",
      "-c", "log_temp_files=0",
      "-c", "log_autovacuum_min_duration=0",
      "-c", "log_line_prefix='%m [%p] %q%u@%d '",
      "-c", "password_encryption=scram-sha-256",
      "-c", "idle_in_transaction_session_timeout=1min",
      "-c", "idle_session_timeout=5min",
      "-c", "shared_preload_libraries=pg_stat_statements,pg_ivm",
      "-c", "pg_stat_statements.track=all"
    ]
    env_file: secrets/postgres/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      [ ledger-network ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 120s

  #  ---

  pghero:
    image: ankane/pghero
    container_name: pghero
    profiles: [pghero]
    restart: unless-stopped
    env_file: secrets/pghero/.env
    expose:
      - "8080"
    networks: [ledger-network]
    healthcheck:
      test: ["CMD-SHELL", " wget --spider -q -T 2 http://pghero:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_interval: 2s
      start_period: 20s
    depends_on:
      postgres:
        condition: service_started

  #  ---

  pgcache:
    image: pgcache/pgcache:0.4.11-amd64
    shm_size: 16g
    profiles: [pgcache, main]
    container_name: pgcache
    restart: unless-stopped
    networks: [ledger-network]
    depends_on:
      - postgres
    expose:
      - "5432"
    ports:
      - "9090:9090"
    volumes:
      # Mount embedded postgres PGDATA as tmpfs so it's clean on every restart.
      # This prevents the 'database "pgcache_cache" already exists' error.
      # Mode 0777 needed because postgres user (uid 70) is not the tmpfs owner.
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 16G
          mode: 0777
    env_file: secrets/pgcache/.env
    environment:
      NUM_WORKERS: 4
      PUBLICATION: pgcache_pub
      SLOT: pgcache_slot
      LOG_LEVEL: info
      PGCACHE_TELEMETRY: off
      METRICS_PORT: "9090"

  #  ---

  haproxy:
    image: haproxy:alpine
    container_name: haproxy
    restart: unless-stopped
    profiles: [main, temporal]
    volumes:
      - ./aux/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./aux/haproxy/certs/example.com.pem:/usr/local/etc/haproxy/example.com.pem:ro
    ports:
      - "5432:5432"
      - "8000:8000"
      - "8001:8001"
      - "8404:8404"
      - "8081:8081"
      - "8080:8080"
      - "8002:8002"
      - "9001:9001"
      - "16686:16686"
    networks: [ledger-network]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q -T 2 http://haproxy:8404/healthz || exit 1"]
    env_file:
      - ./secrets/haproxy/.env

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    profiles: [main]
    expose:
      - "9000" #  for health checking
      - "8443"
      - "8080"
    entrypoint: /opt/keycloak/bin/kc.sh start-dev
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_FEATURES: hostname:v2,opentelemetry
      KC_TRACING_ENABLED: true
      KC_TRACING_JDBC_ENABLED: true
      KC_TELEMETRY_ENDPOINT: http://jaeger:4317
      KC_TELEMETRY_PROTOCOL: grpc
    depends_on:
      - postgres
    networks:
      [ ledger-network ]
    env_file:
      - ./secrets/keycloak/.env
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000 || exit 1"
      ]
      interval: 3s
      start_interval: 1s
      timeout: 1s
      retries: 10
      start_period: 20s

    #  ---

  caddy:
#    image: caddy:2.11-alpine
    build: aux/caddy/.
    restart: unless-stopped
    expose:
      - "8000"
      - "8001"
    volumes:
      - ./aux/caddy:/etc/caddy:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      [ ledger-network ]
    profiles: [main, caddy]
    environment:
      <<: *common_env
      S3_EXT_FILES_BUCKET: "ledger-ext-files"
      KC_ISSUER_WHITELIST: "http://keycloak:8080/realms/test"
      KC_AUDIENCE_WHITELIST: "account"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      OTEL_SERVICE_NAME: "caddy"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/_caddy_ready || exit 1" ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s

  #  ---

  temporal:
    image: temporalio/auto-setup
    container_name: temporal
    profiles: [temporal]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "temporal operator cluster health 2>&1 | grep -Fxq 'SERVING' || exit 1" ]
      start_period: 5s
    depends_on:
      - postgres
    environment:
      <<: *temporal_env
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres228
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
#      OTEL_TRACES_EXPORTER: otlp
#      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
#      OTEL_SERVICE_NAME: "temporal-server"
#      OTEL_TRACES_SAMPLER: parentbased_traceidratio
#      OTEL_TRACES_SAMPLER_ARG: "0.1"
    env_file:
      - ./secrets/temporal-server/.env
    networks:
      [ ledger-network ]
    expose:
      - "7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

   #  ---

  temporal-admin-tools:
    container_name: temporal-admin-tools
    profiles: [temporal]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "temporal operator cluster health 2>&1 | grep -Fxq 'SERVING' || exit 1" ]
    depends_on:
      - temporal
    environment:
      <<: *temporal_env
    image: temporalio/admin-tools
    networks:
      [ ledger-network ]
    stdin_open: true
    tty: true
    stop_grace_period: 4s

  #  ---

  temporal-ui:
    container_name: temporal-ui
    profiles: [temporal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q -T 5 --tries=1 http://temporal-ui:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - temporal
    environment:
      <<: *temporal_env
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
      TEMPORAL_UI_PORT: 8081
    image: temporalio/ui
    networks:
      [ ledger-network ]
    expose:
      - "8081"

  #  ---

  temporal-worker:
    build: etl/.
    container_name: temporal-worker
    profiles: [temporal]
    healthcheck:
      test: ["CMD-SHELL", "python3 workers/healtcheck/ledger.py || exit 1"]
      start_period: 30s
    depends_on:
      - temporal
    environment:
      <<: *temporal_env
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "ledger-etl-worker"
    networks:
      [ ledger-network ]
    restart: unless-stopped
    volumes:
      - ./etl:/app:Z

  #  ---

  minio:
    image: minio/minio
    container_name: minio
    profiles: [minio]
    command: server /data --console-address ":9001"
    env_file:
      - secrets/minio/.env
    networks: [ledger-network]
    volumes:
      - minio_data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 2s
      retries: 3
      start_interval: 2s
      start_period: 15s
    expose:
      - "9000"
      - "9001"

  #  ---

  # Beyla auto-instrumenter for Minio — captures S3 HTTP traces via eBPF
  # and forwards them to Jaeger as OpenTelemetry spans
  beyla-minio:
    image: grafana/beyla:latest
    container_name: beyla-minio
    profiles: [minio]
    restart: unless-stopped
    # Share network and PID namespaces with Minio to inspect its HTTP traffic
    network_mode: "service:minio"
    pid: "service:minio"
    # Required eBPF capabilities for Beyla operation
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - ./aux/beyla/beyla-config.yaml:/beyla-config.yaml:ro
    command: ["-config", "/beyla-config.yaml"]
    depends_on:
      minio:
        condition: service_healthy

  #  ---

  jaeger:
    image: jaegertracing/jaeger
    container_name: jaeger
    profiles: [jaeger, main]
    restart: unless-stopped
    user: "10001:0"
    networks: [ledger-network]
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
      - "16686" # UI
    environment:
      JAEGER_QUERY_UI_CONFIG: /etc/jaeger/jaeger-ui-config.json
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q -T 2 http://localhost:16686/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["--config", "file:/etc/jaeger/jaeger-config.yaml"]
    volumes:
      - jaeger_data:/badger
      - ./aux/jaeger/jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml:ro
      - ./aux/jaeger/jaeger-ui-config.json:/etc/jaeger/jaeger-ui-config.json:ro


networks:
    ledger-network:
      driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  caddy_data:
  caddy_config:
  minio_data:
  jaeger_data:
