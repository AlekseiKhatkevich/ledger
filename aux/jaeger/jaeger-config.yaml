extensions:
  jaeger_storage:
    backends:
      badger:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false

  jaeger_query:
    storage:
      traces: badger

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
