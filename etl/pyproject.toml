[project]
name = "etl"
version = "0.1.0"
description = "Temporal ETL inner project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "asyncstdlib>=3.13.1",
    "cffi>=2.0.0",
    "httpx>=0.28.1",
    "ijson>=3.5.0",
    "msgspec>=0.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-instrumentation-asyncpg>=0.53b0",
    "opentelemetry-instrumentation-httpx>=0.53b0",
    "opentelemetry-instrumentation-logging>=0.53b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.53b0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "temporalio[opentelemetry]>=1.26.0",
]

[dependency-groups]
dev = []
